name: CI

on:
  push:
    branches: [main]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: workshop-app:scan

      - name: scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: workshop-app:scan
          severity: CRITICAL
          exit-code: '1'

      - name: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/workshop-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/workshop-app:${{ github.sha }}