services:
  web:
    # TODO(step-5a): Build local Dockerfile and map port 3000
    build: .
    ports:
      - "3000:3000"

    # TODO(step-5b): Set DATABASE_URL
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/workshop

    # TODO(step-5c): Wait for db health
    depends_on:
      db:
        condition: service_healthy

  db:
    # TODO(step-5d): PostgreSQL image & healthcheck
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workshop"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

    # TODO(step-5e & 5g): Volume & SQL init script mount
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    # TODO(step-5f): Database credentials
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workshop

# TODO(step-5h): Top-level named volume
volumes:
  pgdata: